[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "story-protocol-plugin"
version = "0.1.0"
description = "A plugin for interacting with the Story Protocol API"
readme = "README.md"
authors = [
    {name = "Steven Lee Soon Fatt", email = "steven@virtuals.io"}
]
license = {text = "MIT"}
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.25.0",
]
requires-python = ">=3.8"

[project.urls]
"Homepage" = "https://github.com/game-by-virtuals/game-python/plugins/story_protocol"
"Bug Tracker" = "https://github.com/game-by-virtuals/game-python/issues"

